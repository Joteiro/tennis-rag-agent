name: CI

# Valida en cada push/PR que el proyecto instala y que el grafo de imports y la
# lógica pura siguen sanos (sin consumir APIs ni requerir secrets).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Smoke tests (sin APIs)
        run: pytest -q tests/
