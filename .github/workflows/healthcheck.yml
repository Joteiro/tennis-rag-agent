name: Health check

# Corre el health check de punta a punta (modelos vivos, embeddings, consulta real)
# de forma programada y bajo demanda. Si algo falla —un modelo deprecado, una cuota
# agotada o una dependencia rota— abre/actualiza un Issue y GitHub avisa por email.
#
# Requiere dos secrets del repo (Settings > Secrets and variables > Actions):
#   - GOOGLE_API_KEY   (para los embeddings de Gemini)
#   - GROQ_API_KEY     (para el LLM de chat)

on:
  schedule:
    - cron: "0 8 * * 1"   # todos los lunes a las 08:00 UTC
  workflow_dispatch: {}    # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  issues: write

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que los secrets estén configurados
        run: |
          if [ -z "${{ secrets.GROQ_API_KEY }}" ] || [ -z "${{ secrets.GOOGLE_API_KEY }}" ]; then
            echo "::warning::Faltan GROQ_API_KEY / GOOGLE_API_KEY en los secrets del repo. Se omite el health check."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: env.SKIP != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar health check
        if: env.SKIP != 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
        run: python scripts/healthcheck.py

      - name: Abrir/actualizar Issue si el health check falló
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create healthcheck --color B60205 --description "Fallo del health check automático" --force || true
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY=$(printf 'El health check automático **falló** el %s.\n\n**Run:** %s\n\nPosibles causas: modelo de Groq deprecado, cuota de Gemini/Groq agotada, o una dependencia rota. Revisá el log del run para ver qué chequeo (1–4) falló.' "$(date -u +'%Y-%m-%d %H:%M UTC')" "$RUN_URL")
          EXISTING=$(gh issue list --state open --label healthcheck --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "🚨 Health check falló" --label healthcheck --body "$BODY"
          fi
